name: BrewTracker Watchdogs

on:
  push:
    branches:
      - brewtracker
    paths:
      - 'custom_components/brewfather/**'
      - 'tests/**'
      - 'README.md'
      - 'docs/BREWTRACKER.md'
      - '.github/workflows/brewtracker-watchdogs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install watchdog tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff codespell pre-commit-hooks

      - name: Compile Python
        run: python -m compileall -q custom_components/brewfather

      - name: Ruff critical errors
        run: |
          ruff check \
            --select E9,F63,F7,F82 \
            custom_components/brewfather/__init__.py \
            custom_components/brewfather/const.py \
            custom_components/brewfather/connection.py \
            custom_components/brewfather/coordinator.py \
            custom_components/brewfather/sensor.py

      - name: Check Python AST
        run: |
          check-ast custom_components/brewfather/__init__.py
          check-ast custom_components/brewfather/const.py
          check-ast custom_components/brewfather/connection.py
          check-ast custom_components/brewfather/coordinator.py
          check-ast custom_components/brewfather/sensor.py

      - name: Check YAML
        run: |
          check-yaml --unsafe .github/workflows/brewtracker-watchdogs.yml
          check-yaml --unsafe .github/workflows/hassfest.yaml
          check-yaml --unsafe .github/workflows/hacs-action.yml
          check-yaml --unsafe .github/workflows/tests.yml

      - name: Check JSON
        run: |
          check-json hacs.json
          check-json custom_components/brewfather/manifest.json

      - name: Check BrewTracker documentation spelling
        run: |
          codespell README.md docs/BREWTRACKER.md \
            --quiet-level=2 \
            --ignore-words-list=brewfather,brewtracker,hass,hacs

      - name: BrewTracker wiring contract
        run: |
          python - <<'PY'
          from pathlib import Path

          const = Path('custom_components/brewfather/const.py').read_text()
          connection = Path('custom_components/brewfather/connection.py').read_text()
          coordinator = Path('custom_components/brewfather/coordinator.py').read_text()
          sensor = Path('custom_components/brewfather/sensor.py').read_text()
          init = Path('custom_components/brewfather/__init__.py').read_text()

          required = {
              'const.py': [
                  'ALL_BATCHES_URI',
                  'BREWTRACKER_URI',
              ],
              'connection.py': [
                  'def get_all_batches',
                  'def get_brewtracker',
              ],
              'coordinator.py': [
                  'brew_tracker',
                  'add_brewtracker_discovery_data',
                  '_brewtracker_active',
              ],
              'sensor.py': [
                  'brewtracker_status',
                  'brewtracker_stage',
                  'brewtracker_step',
                  'brewtracker_progress',
                  'brewtracker_time_remaining',
                  'brewtracker_next_step',
                  'brewtracker_raw',
              ],
              '__init__.py': [
                  'sensor.brewfather_brew_tracker_status',
                  'sensor.brewfather_brewtracker_status',
                  'BREW_TRACKER_RESUME_SECOND_REFRESH_DELAY_SECONDS = 8',
              ],
          }
          sources = {
              'const.py': const,
              'connection.py': connection,
              'coordinator.py': coordinator,
              'sensor.py': sensor,
              '__init__.py': init,
          }

          missing = []
          for filename, markers in required.items():
              for marker in markers:
                  if marker not in sources[filename]:
                      missing.append(f'{filename}: {marker}')

          if missing:
              raise SystemExit('Missing BrewTracker contract markers:\n' + '\n'.join(missing))

          print('BrewTracker wiring contract OK')
          PY

  tests:
    name: Existing pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run existing tests
        run: pytest tests/test_batch_item.py -q
